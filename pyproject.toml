[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tarefas-api"
version = "0.1.0"
description = "API de lista de tarefas (SDD): FastAPI + SQLite/SQLAlchemy"
# NOTA: ADR-001 (docs/decisoes_tecnicas.md) fixa Python 3.12 como linha de
# referência do projeto. Felipe decidiu (07/09/2026) usar 3.14 localmente;
# isso diverge do ADR e ainda não foi registrado em docs/refinamentos.md
# nem combinado com Vitor/Caike. Ajustar ou reverter conforme a revisão do
# grupo antes do PR.
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2",
    "sqlalchemy>=2,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]
