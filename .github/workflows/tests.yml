name: Testes

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
      - name: Instalar dependências
        run: python -m pip install -e ".[test]"
      - name: Conferir ambiente e versão
        run: |
          git rev-parse HEAD
          python --version
          python -m pip check
          python -m pip freeze
      - name: Executar testes
        run: python -m pytest -v --junitxml=test-results/pytest.xml
      - name: Construir container
        run: docker build -t tarefas-api:test .
      - name: Executar testes no container
        run: docker run --rm -v "${{ github.workspace }}/test-results:/resultados" tarefas-api:test python -m pytest -v --junitxml=/resultados/docker.xml
      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes
          path: test-results/*.xml
          if-no-files-found: warn
