name: Testes e Docker

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.10'
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -e ".[test]"

      - name: Verificar dependências
        run: python -m pip check

      - name: Criar pasta de resultados
        run: mkdir -p test-results

      - name: Executar testes no Python
        run: |
          python -m pytest -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:test-results/coverage.xml \
            --junitxml=test-results/pytest.xml

      - name: Construir imagem Docker
        run: docker build -t tarefas-api:test .

      - name: Executar testes no Docker
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/test-results:/resultados" \
            tarefas-api:test \
            python -m pytest -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:/resultados/coverage-docker.xml \
            --junitxml=/resultados/docker.xml

      - name: Guardar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-testes
          path: test-results/*.xml
          if-no-files-found: warn
